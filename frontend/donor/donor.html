<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0e12">
    <title>Donor — BBMS</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-app role-donor">

<header class="topbar">
    <div class="app-header-inner">
        <div class="app-title-block">
            <span class="header-logo" aria-hidden="true"></span>
            <h1>Donor hub</h1>
            <span class="role-badge">Donor</span>
        </div>
        <div class="app-header-actions">
            <button type="button" class="btn btn-ghost" onclick="logout()">Log out</button>
        </div>
    </div>
</header>

<main class="app-main">
    <div class="layout-grid cols-2">

    <section class="card span-2">
        <h2>Welcome</h2>
        <p id="userInfo"></p>
    </section>

    <section class="card">
        <h2>Your profile</h2>
        <div id="profileBox">Loading profile…</div>
    </section>

    <section class="card">
        <h2>Update profile</h2>
        <form id="profileForm" class="form-row">
            <input type="text" id="updateFirstName" placeholder="First name" required>
            <input type="text" id="updateLastName" placeholder="Last name" required>
            <input type="text" id="updatePhone" placeholder="Phone" required>
            <input type="text" id="updateHealthStatus" placeholder="Health status" required>
            <input type="number" id="updateWeight" placeholder="Weight (kg)" required>
            <select id="updateMedication">
                <option value="false">No medication restriction</option>
                <option value="true">Medication restricted</option>
            </select>
            <button type="submit" class="btn btn-primary">Save changes</button>
        </form>
    </section>

    <section class="card span-2">
        <h2>Find hospitals</h2>
        <div class="toolbar">
            <input type="text" id="hospitalSearch" placeholder="Search by name or location">
            <button type="button" class="btn btn-secondary" onclick="loadHospitals()">Search</button>
        </div>
        <div id="hospitalsTable">Loading hospitals…</div>
    </section>

    <section class="card">
        <h2>Schedule donation</h2>
        <form id="appointmentForm" class="form-row">
            <select id="appointmentHospitalId" required>
    <option value="">Select hospital</option>
</select>
            <input type="datetime-local" id="appointmentDateTime" required min="">
            <input type="text" id="appointmentNotes" placeholder="Notes (optional)">
            <button type="submit" class="btn btn-primary">Schedule</button>
        </form>
    </section>

    <section class="card">
        <h2>Your appointments</h2>
        <div id="appointmentsTable">Loading appointments…</div>
    </section>

    <section class="card span-2">
        <h2>Donation history</h2>
        <div id="historyTable">Loading history…</div>
    </section>

    <section class="card span-2">
        <h2>Notifications</h2>
        <div id="notificationsBox">Loading notifications…</div>
    </section>

    </div>
</main>

<script src="donor.js"></script>
</body>
</html>
