<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0e12">
    <title>Hospital staff — BBMS</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body class="page-app role-staff">

<header class="topbar">
    <div class="app-header-inner">
        <div class="app-title-block">
            <span class="header-logo" aria-hidden="true"></span>
            <h1>Hospital operations</h1>
            <span class="role-badge">Staff</span>
        </div>
        <div class="app-header-actions">
            <button type="button" class="btn btn-ghost" onclick="logout()">Log out</button>
        </div>
    </div>
</header>

<main class="app-main">
    <div class="layout-grid cols-2">

    <section class="card span-2">
        <h2>Your session</h2>
        <p id="userInfo"></p>
    </section>

    <section class="card">
        <h2>Inventory filter</h2>
        <div class="toolbar">
            <input type="text" id="filterType" placeholder="Blood type (A+, O−…)">
            <button type="button" class="btn btn-secondary" onclick="loadInventory()">Apply filter</button>
        </div>
        <p class="inline-note">Leave blank to list all units for your hospital.</p>
    </section>

    <section class="card">
        <h2>Blood inventory</h2>
        <div id="inventoryTable">Loading…</div>
    </section>

    <section class="card">
        <h2>Add blood unit</h2>
        <form id="bloodForm" class="form-row" autocomplete="off">
            <input type="number" id="donor_id" placeholder="Donor ID (optional)">
            <input type="text" id="blood_type" placeholder="Blood type" required>
            <input type="number" id="quantity_ml" placeholder="Quantity (ml)" required>
            <input type="date" id="donation_date" required>
            <input type="date" id="expiry_date" required>
            <button type="submit" class="btn btn-primary">Add unit</button>
        </form>
    </section>

    <section class="card">
        <h2>Register donation</h2>
        <form id="donationForm" class="form-row">
            <input type="number" id="donor_id_donation" placeholder="Donor ID" required>
            <input type="text" id="blood_type_donation" placeholder="Blood type" required>
            <input type="number" id="quantity_donation" placeholder="Quantity (ml)" required>
            <button type="submit" class="btn btn-primary">Register</button>
        </form>
    </section>

    <section class="card span-2">
        <h2>Blood requests</h2>
        <div id="requestsTable">Loading…</div>
    </section>

    </div>
</main>

<script>
<!--const API_URL = "http://127.0.0.1:5000/api";-->
const API_URL = "https://blood-bank-management-system-production-0359.up.railway.app/api";

let staffProfile = null;

const user = JSON.parse(localStorage.getItem("bbms_user"));
if (!user || user.role !== "HospitalStaff") {
    window.location.href = "../index.html";
}

function logout() {
    localStorage.removeItem("bbms_user");
    window.location.href = "../index.html";
}

async function loadStaffProfile() {
    const res = await fetch(`${API_URL}/staff/${user.user_id}/profile`);
    const result = await res.json();
    staffProfile = result.data;
    document.getElementById("userInfo").textContent =
        `${user.full_name} — ${staffProfile.hospital_name}`;
}

async function loadInventory() {
    const filter = document.getElementById("filterType").value.toLowerCase();
    const res = await fetch(`${API_URL}/staff/${user.user_id}/inventory`);
    const result = await res.json();

    let html = `<div class="table-scroll"><table class="data-table">
        <thead><tr>
            <th>ID</th><th>Type</th><th>Qty</th><th>Status</th>
            <th>Expiry</th><th>Actions</th>
        </tr></thead><tbody>`;

    result.data.forEach(b => {
        if (filter && !b.blood_type.toLowerCase().includes(filter)) return;
        html += `
        <tr>
            <td>${b.blood_unit_id}</td>
            <td>${b.blood_type}</td>
            <td>${b.quantity_ml}</td>
            <td><span class="status-pill">${b.status}</span></td>
            <td>${b.expiry_date}</td>
            <td>
                <button type="button" class="btn btn-sm btn-secondary" onclick="editUnit(${b.blood_unit_id})">Edit</button>
                <button type="button" class="btn btn-sm btn-danger" onclick="deleteUnit(${b.blood_unit_id})">Delete</button>
            </td>
        </tr>`;
    });

    html += "</tbody></table></div>";
    document.getElementById("inventoryTable").innerHTML = html;
}

async function editUnit(id) {
    const qty = prompt("New quantity:");
    const status = prompt("Status (Available/Used/Expired):");

    await fetch(`${API_URL}/blood-units/${id}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            quantity_ml: qty,
            expiry_date: new Date().toISOString().split('T')[0],
            status: status
        })
    });

    loadInventory();
}

async function deleteUnit(id) {
    if (!confirm("Delete this unit?")) return;
    await fetch(`${API_URL}/blood-units/${id}`, { method: "DELETE" });
    loadInventory();
}

async function loadRequests() {
    const res = await fetch(`${API_URL}/staff/${user.user_id}/requests`);
    const result = await res.json();

    if (!result.data || result.data.length === 0) {
        document.getElementById("requestsTable").innerHTML = "<p class=\"muted\">No requests found.</p>";
        return;
    }

    let html = `<div class="table-scroll"><table class="data-table">
        <thead><tr>
            <th>ID</th><th>Recipient</th><th>Type</th>
            <th>Qty</th><th>Status</th><th>Action</th>
        </tr></thead><tbody>`;

    result.data.forEach(r => {
        const isPending = r.status === "Pending";
        html += `
        <tr>
            <td>${r.request_id}</td>
            <td>${r.recipient_name}</td>
            <td>${r.blood_type}</td>
            <td>${r.quantity_needed_ml}</td>
            <td><span class="status-pill">${r.status}</span></td>
            <td>
                ${isPending ? `
                    <button type="button" class="btn btn-sm btn-secondary" onclick="approve(${r.request_id})">Approve</button>
                    <button type="button" class="btn btn-sm btn-danger" onclick="rejectReq(${r.request_id})">Reject</button>
                ` : `<span class="muted">${r.status}</span>`}
            </td>
        </tr>`;
    });

    html += "</tbody></table></div>";
    document.getElementById("requestsTable").innerHTML = html;
}

async function approve(id) {
    const unit = prompt("Enter matching blood unit ID:");
    if (!unit) return;

    const res = await fetch(`${API_URL}/blood-requests/${id}/fulfill`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            blood_unit_id: unit,
            staff_id: staffProfile.staff_id
        })
    });

    const result = await res.json();

    if (!result.success) {
        alert("Error: " + result.error);
        return;
    }

    alert("Request fulfilled successfully!");
    loadRequests();
    loadInventory();
}

async function rejectReq(id) {
    const reason = prompt("Reason:");

    await fetch(`${API_URL}/blood-requests/${id}/reject`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            staff_id: staffProfile.staff_id,
            reason: reason
        })
    });

    loadRequests();
}

async function init() {
    await loadStaffProfile();
    await loadInventory();
    await loadRequests();

    document.getElementById("bloodForm").addEventListener("submit", async e => {
        e.preventDefault();

        const response = await fetch(`${API_URL}/blood-units`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                hospital_id: staffProfile.hospital_id,
                donor_id: document.getElementById("donor_id").value || null,
                blood_type: document.getElementById("blood_type").value,
                quantity_ml: document.getElementById("quantity_ml").value,
                donation_date: document.getElementById("donation_date").value,
                expiry_date: document.getElementById("expiry_date").value
            })
        });

        const result = await response.json();
        if (!result.success) {
            alert("Error: " + (result.error || result.message || "Could not add blood unit"));
            return;
        }

        alert("Blood unit added successfully");
        document.getElementById("bloodForm").reset();
        await loadInventory();
    });

    document.getElementById("donationForm").addEventListener("submit", async e => {
        e.preventDefault();

        await fetch(`${API_URL}/staff/register-donation`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                donor_id: document.getElementById("donor_id_donation").value,
                staff_id: staffProfile.staff_id,
                hospital_id: staffProfile.hospital_id,
                blood_type: document.getElementById("blood_type_donation").value,
                quantity_ml: document.getElementById("quantity_donation").value
            })
        });

        alert("Donation registered!");
        e.target.reset();
        loadInventory();
    });
}

document.addEventListener("DOMContentLoaded", () => {
    init();
});
</script>

</body>
</html>
